server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/learniq_db
    username: learniq_admin
    password: ${DB_PASSWORD:learniq_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:mustBeAtLeast32CharsLongForHS256Security!}
  access-token-expiry-ms: 3600000      # 1 saat
  refresh-token-expiry-days: 7
