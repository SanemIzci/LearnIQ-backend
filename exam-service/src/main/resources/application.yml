server:
  port: 8082

spring:
  application:
    name: exam-service
  datasource:
    url: jdbc:postgresql://localhost:5432/learniq_db
    username: learniq_admin
    password: ${DB_PASSWORD:learniq_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

jwt:
  secret: ${JWT_SECRET:mustBeAtLeast32CharsLongForHS256Security!}
