server:
  port: 8084

spring:
  application:
    name: ai-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ai-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    # ── RAG / pgvector (Faz 4) ──────────────────────────────────────────────
    # rag_documents her kiracının KENDİ şemasında tutulur (schema-per-tenant izolasyonu);
    # ingestion consumer'ı ilgili tenant için SET search_path yapıp tek bağlantı havuzunu kullanır.
    url: ${RAG_DB_URL:jdbc:postgresql://localhost:5432/learniq_db}
    username: ${RAG_DB_USER:learniq_admin}
    password: ${RAG_DB_PASSWORD:learniq_password}
    hikari:
      pool-name: rag-pool
      maximum-pool-size: 5
  ai:
    openai:
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY}
      chat:
        options:
          model: google/gemma-4-26b-a4b-it:free
      # RAG ingestion (Faz 4): embedding provider.
      # OpenRouter /v1/embeddings desteklemeyebilir; gerekirse base-url/api-key
      # bağımsız bir embedding sağlayıcısına (ör. OpenAI) env üzerinden yönlendirilir.
      embedding:
        options:
          model: text-embedding-3-small

# ── RAG: embedding provider (chat'ten bağımsız) ─────────────────────────────
# Chat OpenRouter üzerinden çalışır; embedding ayrı sağlayıcıya yönlenir.
rag:
  embedding:
    base-url: ${RAG_EMBEDDING_BASE_URL:https://api.openai.com}
    api-key: ${RAG_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
    model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${RAG_EMBEDDING_DIMENSIONS:1536}
    model-sig: ${RAG_EMBEDDING_MODEL_SIG:text-embedding-3-small@1536}
  backfill:
    batch-size: ${RAG_BACKFILL_BATCH_SIZE:50}
  chat:
    top-k: 5
    similarity-threshold: 0.30
    at-risk-default-net-threshold: 15.0
    # Boş = model filtresi yok (geçiş uyumluluğu). Model geçişinde imza listesi verilir.
    allowed-model-sigs: ${RAG_ALLOWED_MODEL_SIGS:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

aws:
  s3:
    endpoint: http://localhost:4566
    region: us-east-1
    access-key: test
    secret-key: test
    bucket-name: learniq-reports
