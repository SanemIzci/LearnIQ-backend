server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # ── Public auth endpoints (no JWT required) ──────────────────────
        - id: auth-public
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/login,/api/v1/auth/refresh

        # ── Protected auth endpoints (JWT required — ADMIN only for register) ─
        - id: auth-protected
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/register,/api/v1/auth/me,/api/v1/auth/logout
          filters:
            - JwtAuthenticationFilter

        # ── Tenant management (open for now) ─────────────────────────────
        - id: tenant-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/tenants/**

        # ── Platform SUPER_ADMIN login (open) ─────────────────────────────
        - id: platform-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/platform/**
        - id: exam-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/exams/**,/api/v1/analytics/**,/api/v1/classrooms/**
          filters:
            - JwtAuthenticationFilter
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

jwt:
  secret: ${JWT_SECRET:mustBeAtLeast32CharsLongForHS256Security!}
