server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # ── Public auth endpoints (no JWT required) ──────────────────────
        - id: auth-public
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/login,/api/v1/auth/refresh

        # ── Protected auth endpoints (JWT required — ADMIN only for register/users) ─
        - id: auth-protected
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/register,/api/v1/auth/me,/api/v1/auth/logout,/api/v1/users/**
          filters:
            - JwtAuthenticationFilter

        # ── Tenant management (open for now) ─────────────────────────────
        - id: tenant-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/tenants/**

        # ── Platform SUPER_ADMIN login (open) ─────────────────────────────
        - id: platform-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/platform/auth/login

        # ── Platform SUPER_ADMIN management (JWT required) ────────────────
        - id: platform-admin
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/platform/admin/**
          filters:
            - JwtAuthenticationFilter

        # ── Public exam/share endpoints (no JWT required) ─────────────────
        - id: exam-public
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/public/**

        # ── Protected exam & student endpoints (JWT required) ─────────────
        - id: exam-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/exams/**,/api/v1/analytics/**,/api/v1/classrooms/**,/api/v1/reports/**,/api/v1/students/**,/api/v1/subjects/**,/api/v1/teachers/**
          filters:
            - JwtAuthenticationFilter

        # ── Protected AI endpoints — admin RAG chat (JWT required) ────────
        - id: ai-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - JwtAuthenticationFilter
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

jwt:
  secret: ${JWT_SECRET:mustBeAtLeast32CharsLongForHS256Security!}
